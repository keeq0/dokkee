services:
  postgres:
    image: postgres:18-alpine
    container_name: dokkee-postgres
    env_file: .env
    expose:
      - "5432"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Монтируем /var/lib/postgresql (не /data), потому что postgres:18-alpine
      # инициализирует кластер в /var/lib/postgresql/data, и при монтаже
      # именно /data внутрь именованного тома контейнер падает при старте.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: dokkee-postgres-migrate
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dokkee-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: dokkee-minio-init
    environment:
      - MC_ACCESS_KEY=${S3_ACCESS_KEY}
      - MC_SECRET_KEY=${S3_SECRET_KEY}
      - MC_BUCKET=${S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MC_ACCESS_KEY $$MC_SECRET_KEY &&
      mc mb --ignore-existing local/$$MC_BUCKET &&
      mc anonymous set download local/$$MC_BUCKET &&
      echo \"Bucket $$MC_BUCKET ready\";
      "

  backend:
    build:
      context: ./backend
      args:
        - PORT=${PORT:-8000}
    container_name: dokkee-backend
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      # Порт postgres внутри docker-сети (всегда 5432).
      # POSTGRES_PORT в .env - это хостовый маппинг (например 5433), не менять здесь.
      - POSTGRES_PORT=5432
    expose:
      - "${PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: dokkee-frontend
    env_file: .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/babel.config.js:/app/babel.config.js
      - ./frontend/vue.config.js:/app/vue.config.js
      - ./frontend/jsconfig.json:/app/jsconfig.json
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: dokkee-nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # service_started (не service_healthy): у backend пока нет healthcheck,
      # будет добавлен в PR-6.
      backend:
        condition: service_started
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
